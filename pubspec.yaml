name: nothing_dialer
description: "Nothing Phone 1 Outgoing Call Glyph Trigger – triggers Glyph lights during dialing."
publish_to: 'none'

version: 1.5.0+11

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localized_locales: ^2.0.5
  # Glyph interface control for Nothing Phones
  nothing_glyph_interface: 
    git:
      url: https://github.com/rkvishwa/flutter-nothing-glyph-interface.git
      ref: fix-display-progress-and-toggle
  # Runtime permission handling
  permission_handler: ^11.3.1
  # Phone contacts (synced with system)
  flutter_contacts: ^1.1.9+2
  # Call log / recent calls history
  call_log: ^6.0.1
  # Date formatting for Recents
  intl: ^0.20.1
  shared_preferences: ^2.5.4
  flutter_colorpicker: ^1.1.0
  url_launcher: ^6.3.2
  in_app_review: ^2.0.10
  share_plus: ^7.2.2
  path_provider: ^2.1.2

  flutter_launcher_icons: ^0.13.1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon_default"
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/np1-layout.png
    - assets/app_icon.png
    - assets/app_icon_monochrome.png
    - assets/launcher/
    - assets/fonts/

  fonts:
    - family: NDot55Caps
      fonts:
        - asset: assets/fonts/Ndot55Caps-Regular.otf
          weight: 400
    - family: NDot55Regular
      fonts:
        - asset: assets/fonts/Ndot55-Regular.otf
          weight: 400
    - family: RobotoSerif
      fonts:
        - asset: assets/fonts/RobotoSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoSerif-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoSerif-SemiBold.ttf
          weight: 600

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
